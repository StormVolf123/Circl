<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circl – App Prototype</title>
<link rel="icon" href="logo-mark.png">
<style>
:root{
  --brand:#5B4BFF; --brand-d:#4033D6; --brand-l:#ECEAFF;
  --coral:#FF7A59; --coral-l:#FFE9E2;
  --mint:#18C79A; --mint-l:#DDF8F0;
  --sun:#FFB020; --sun-l:#FFF2D6;
  --ink:#16142B; --ink2:#5E5C74; --ink3:#9A98AE;
  --bg:#F5F4FB; --card:#fff; --line:#ECEBF4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 700px at 20% 10%,#2b2670 0%,#15132e 55%,#0d0c1d 100%);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:72px;overflow:hidden}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}

/* ---------- presenter side panel ---------- */
.side{width:300px;color:#fff;flex-shrink:0}
.side .logo{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.side h1{font-size:38px;letter-spacing:-1px}
.side p{color:#b8b5de;font-size:15px;line-height:1.5;margin-bottom:26px}
.side h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a86c4;margin-bottom:10px}
.jump{display:flex;flex-direction:column;gap:6px}
.jump button{text-align:left;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);color:#e6e4ff;font-size:14px;transition:.15s;display:flex;justify-content:space-between}
.jump button:hover{background:rgba(255,255,255,.14)}
.jump button.on{background:var(--brand);color:#fff}
.jump button span{opacity:.5;font-size:12px}
.hint{margin-top:22px;font-size:12px;color:#8a86c4;line-height:1.5}
@media (max-width:900px){.side{display:none}}

/* ---------- phone frame ---------- */
.stage{position:relative;flex-shrink:0}
.phone{width:417px;height:876px;border-radius:70px;padding:12px;background:linear-gradient(145deg,#4a4a52,#1b1b20 40%,#3a3a42);box-shadow:0 0 0 2px #0a0a0d,0 50px 100px rgba(0,0,0,.55),inset 0 0 6px rgba(255,255,255,.25);position:absolute;top:0;left:0;transform-origin:top left}
.phone:before,.phone:after{content:"";position:absolute;width:4px;background:#2b2b31;border-radius:2px}
.phone:before{left:-4px;top:150px;height:60px;box-shadow:0 80px 0 #2b2b31}
.phone:after{right:-4px;top:200px;height:96px}
.screen{position:relative;width:393px;height:852px;border-radius:58px;background:var(--bg);overflow:hidden}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:#000;z-index:100}
.status{position:absolute;top:0;left:0;right:0;height:54px;padding:18px 34px 0 42px;display:flex;justify-content:space-between;font-weight:600;font-size:16px;z-index:90;pointer-events:none}
.status.light{color:#fff}
.status .r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:var(--ink);z-index:100;pointer-events:none}
.homebar.light{background:#fff}

/* ---------- app shell ---------- */
#app{position:absolute;inset:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.view.push{animation:slide .28s cubic-bezier(.2,.8,.2,1)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:58px 0 110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}

.tabbar{position:absolute;bottom:0;left:0;right:0;height:92px;background:rgba(255,255,255,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 12px 0;z-index:50}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--ink3);width:62px;height:48px;position:relative}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--brand)}
.tab .dot{position:absolute;top:-2px;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--coral);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,var(--brand),#8A5BFF);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 10px 24px rgba(91,75,255,.5);transition:.15s}
.fab:active{transform:scale(.94)}
.fab svg{width:28px;height:28px}

/* ---------- common ---------- */
.h1{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.h2{font-size:20px;font-weight:800;letter-spacing:-.4px}
.sub{color:var(--ink2);font-size:14px;line-height:1.45}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 20px 12px}
.sec a{font-size:13px;font-weight:600;color:var(--brand);cursor:pointer}
.chip{padding:9px 15px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:.15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px}
.tag.mint{background:var(--mint-l);color:#0b8f6c}
.tag.brand{background:var(--brand-l);color:var(--brand-d)}
.tag.coral{background:var(--coral-l);color:#d4502d}
.tag.sun{background:var(--sun-l);color:#9a6600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:18px;font-weight:700;font-size:16px;transition:.15s;width:100%}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);color:#fff;box-shadow:0 10px 24px rgba(91,75,255,.35)}
.btn.sec2{background:var(--brand-l);color:var(--brand-d)}
.btn.ok{background:var(--mint-l);color:#0b8f6c}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(22,20,43,.07);position:relative}
.iconbtn svg{width:21px;height:21px}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;border:2.5px solid #fff;flex-shrink:0}
.avs{display:flex}
.avs .av{margin-left:-10px;width:28px;height:28px;font-size:10.5px;border-width:2px}
.avs .av:first-child{margin-left:0}
.avs .more{background:var(--brand-l);color:var(--brand-d)}

/* ---------- discover ---------- */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.pts{display:flex;align-items:center;gap:6px;background:#fff;padding:9px 13px 9px 10px;border-radius:99px;font-weight:800;font-size:14px;box-shadow:0 2px 10px rgba(22,20,43,.07)}
.pts i{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#FFC93C,#FF9A1F);display:block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.search{margin:18px 20px 16px;height:50px;border-radius:16px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--ink3);font-size:15px;box-shadow:0 2px 10px rgba(22,20,43,.05)}
.search svg{width:19px;height:19px}
.hero{margin:0 20px;border-radius:28px;padding:20px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(140deg,#5B4BFF 0%,#8A5BFF 55%,#C85BFF 100%);cursor:pointer;min-height:196px;display:flex;flex-direction:column;justify-content:space-between}
.hero .big{position:absolute;right:-14px;top:-8px;font-size:130px;opacity:.95;transform:rotate(12deg);filter:drop-shadow(0 12px 18px rgba(0,0,0,.25))}
.hero .live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.2);padding:5px 10px;border-radius:99px;width:fit-content;backdrop-filter:blur(6px)}
.hero .live:before{content:"";width:7px;height:7px;border-radius:50%;background:#7CFFC9;box-shadow:0 0 0 4px rgba(124,255,201,.3)}
.hero h3{font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin:44px 0 6px;max-width:210px}
.hero .meta{font-size:13.5px;opacity:.9}
.hero .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.hero .go{background:#fff;color:var(--brand-d);font-weight:800;font-size:13.5px;padding:10px 16px;border-radius:99px}
.hero .avs .av{border-color:#7a52ff}
.people{display:flex;gap:12px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.pcard{flex:0 0 138px;background:#fff;border-radius:22px;padding:16px 12px 14px;text-align:center;box-shadow:0 2px 12px rgba(22,20,43,.05)}
.pcard .av{width:58px;height:58px;font-size:19px;margin:0 auto 10px;border:0}
.pcard b{font-size:14.5px;display:block}
.pcard small{font-size:11.5px;color:var(--ink2);display:block;margin:2px 0 10px}
.pcard .m{font-size:11px;font-weight:700;color:var(--brand-d);background:var(--brand-l);border-radius:99px;padding:4px 8px;display:inline-block;margin-bottom:10px}
.pcard button{width:100%;height:34px;border-radius:12px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700}
.pcard button.done{background:var(--mint-l);color:#0b8f6c}
.acard{margin:0 20px 12px;background:#fff;border-radius:24px;padding:14px;display:flex;gap:14px;box-shadow:0 2px 12px rgba(22,20,43,.05);cursor:pointer;transition:.15s}
.acard:active{transform:scale(.985)}
.tile{width:68px;height:68px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0}
.acard .t{font-weight:800;font-size:16.5px;letter-spacing:-.2px;margin-bottom:3px}
.acard .m{font-size:12.5px;color:var(--ink2);margin-bottom:9px}
.acard .b{display:flex;justify-content:space-between;align-items:center}
.spots{font-size:12px;font-weight:700;color:var(--ink2)}
.spots.low{color:#d4502d}

/* ---------- detail ---------- */
.dhead{height:290px;position:relative;display:flex;align-items:flex-end;padding:0 20px 56px;color:#fff;overflow:hidden;flex-shrink:0}
.dhead .em{position:absolute;right:-6px;top:56px;font-size:150px;transform:rotate(10deg);filter:drop-shadow(0 14px 20px rgba(0,0,0,.28))}
.dnav{position:absolute;top:56px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:5}
.dnav .iconbtn{background:rgba(255,255,255,.22);backdrop-filter:blur(10px);color:#fff;box-shadow:none}
.sheetbody{flex:1;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;margin-top:-30px;position:relative;padding:24px 20px 140px;scrollbar-width:none}
.sheetbody::-webkit-scrollbar{display:none}
.irow{display:flex;gap:14px;align-items:center;padding:12px 0}
.ic{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--brand);box-shadow:0 2px 10px rgba(22,20,43,.05);flex-shrink:0}
.ic svg{width:21px;height:21px}
.irow b{display:block;font-size:15px}
.irow span{font-size:13px;color:var(--ink2)}
.why{background:linear-gradient(135deg,var(--brand-l),#F3E9FF);border-radius:20px;padding:14px 16px;display:flex;gap:12px;margin:14px 0}
.why .sp{font-size:22px}
.why b{font-size:13.5px;color:var(--brand-d)}
.why p{font-size:12.5px;color:#5a4fb8;margin-top:2px;line-height:1.4}
.going{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.going::-webkit-scrollbar{display:none}
.g{text-align:center;flex:0 0 62px}
.g .av{width:52px;height:52px;border:0;font-size:16px;margin:0 auto 6px;position:relative}
.g small{font-size:11.5px;font-weight:600;display:block}
.g em{font-style:normal;font-size:10px;color:#0b8f6c;font-weight:700}
.cta{position:absolute;bottom:0;left:0;right:0;padding:14px 20px 34px;background:linear-gradient(to top,var(--bg) 70%,rgba(245,244,251,0));display:flex;gap:12px;align-items:center;z-index:20}
.cta .price{flex-shrink:0;line-height:1.15}
.cta .price b{font-size:22px;letter-spacing:-.5px}
.cta .price small{display:block;font-size:11.5px;color:var(--ink2)}
.host{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px 14px;margin:6px 0 4px}
.host .av{border:0;border-radius:14px;width:42px;height:42px}

/* ---------- sheet / modal ---------- */
.scrim{position:absolute;inset:0;background:rgba(15,13,38,.45);z-index:200;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:34px 34px 0 0;padding:12px 22px 38px;z-index:210;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 18px}
.line{display:flex;justify-content:space-between;font-size:14.5px;padding:9px 0;color:var(--ink2)}
.line b{color:var(--ink)}
.line.tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;font-size:16px}
.bigcheck{width:84px;height:84px;border-radius:50%;background:var(--mint-l);color:var(--mint);display:flex;align-items:center;justify-content:center;margin:6px auto 16px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.bigcheck svg{width:42px;height:42px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:300;white-space:nowrap;animation:drop .35s cubic-bezier(.2,1.2,.4,1);box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- plans ---------- */
.seg{display:flex;background:#E8E6F4;border-radius:14px;padding:4px;margin:16px 20px 18px}
.seg button{flex:1;padding:9px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(22,20,43,.1)}
.plan{margin:0 20px 14px;background:#fff;border-radius:24px;padding:16px;box-shadow:0 2px 12px rgba(22,20,43,.05)}
.plan .top{display:flex;gap:14px;align-items:center;margin-bottom:14px;cursor:pointer}
.plan .when{font-size:12px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.plan .nm{font-weight:800;font-size:16.5px;margin:1px 0}
.empty{text-align:center;padding:50px 40px;color:var(--ink2)}
.empty .e{font-size:54px;margin-bottom:10px}
.jr{margin:0 20px 12px;background:#fff;border-radius:22px;padding:16px;display:flex;gap:14px}
.jr .tile{width:52px;height:52px;font-size:26px;border-radius:16px}
.jr b{font-size:15px}
.jr p{font-size:13px;color:var(--ink2);margin:3px 0 7px;line-height:1.4}
.empty-cta{margin:0 20px}

/* ---------- chat ---------- */
.crow{display:flex;gap:14px;padding:14px 20px;align-items:center;cursor:pointer;transition:.15s}
.crow:active{background:#ecebf6}
.crow .tile{width:56px;height:56px;font-size:28px;border-radius:19px}
.crow .mid{flex:1;min-width:0}
.crow b{font-size:15.5px;display:block}
.crow p{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.crow .tm{font-size:11.5px;color:var(--ink3);text-align:right}
.crow .un{display:inline-flex;min-width:20px;height:20px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-top:6px;padding:0 6px}
.chead{padding:52px 16px 12px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:5}
.chead .tile{width:42px;height:42px;font-size:21px;border-radius:14px}
.chead .iconbtn{box-shadow:none;background:var(--bg)}
.chead b{display:block;font-size:16px}
.chead small{font-size:12px;color:var(--mint);font-weight:600}
.msgs{flex:1;overflow-y:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.pin{background:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:12.5px;box-shadow:0 2px 10px rgba(22,20,43,.05);margin-bottom:4px}
.pin b{color:var(--brand-d)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:84%}
.msg .av{width:30px;height:30px;font-size:11px;border:0}
.msg .bub{background:#fff;padding:10px 14px;border-radius:20px 20px 20px 6px;font-size:14.5px;line-height:1.4;box-shadow:0 1px 6px rgba(22,20,43,.05)}
.msg .nm{font-size:11px;font-weight:700;color:var(--ink2);margin:0 0 3px 4px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--brand);color:#fff;border-radius:20px 20px 6px 20px}
.sysmsg{align-self:center;font-size:11.5px;color:var(--ink3);font-weight:600;background:#E8E6F4;padding:5px 12px;border-radius:99px}
.qr{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.qr button{white-space:nowrap;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:99px;color:var(--brand-d)}
.composer{padding:8px 16px 34px;display:flex;gap:10px;align-items:center;background:var(--bg)}
.composer input{flex:1;height:46px;border-radius:23px;border:1px solid var(--line);background:#fff;padding:0 18px;font:inherit;font-size:15px;outline:none}
.composer input:focus{border-color:var(--brand)}
.send{width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.send svg{width:20px;height:20px}

/* ---------- create ---------- */
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.inp{width:100%;height:52px;border-radius:16px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font:inherit;font-size:15.5px;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--brand)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 0 8px;font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;gap:3px;align-items:center}
.cat span{font-size:24px}
.cat.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);height:52px;border-radius:16px;padding:0 8px 0 16px;font-weight:700}
.step div{display:flex;gap:6px}
.step button{width:36px;height:36px;border-radius:12px;background:var(--brand-l);color:var(--brand-d);font-size:20px;font-weight:700}
.tog{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.tog b{font-size:14.5px;display:block}
.tog small{font-size:12px;color:var(--ink2)}
.sw{width:50px;height:30px;border-radius:15px;background:#D7D5E6;position:relative;transition:.2s;flex-shrink:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.sw.on{background:var(--mint)}
.sw.on:after{left:23px}

/* ---------- profile ---------- */
.pbanner{height:190px;background:linear-gradient(140deg,#5B4BFF,#8A5BFF 60%,#FF7A59);position:relative;border-radius:0 0 36px 36px;flex-shrink:0}
.pbanner .rings{position:absolute;right:-30px;top:20px;opacity:.25}
.pcard2{margin:-70px 20px 0;background:#fff;border-radius:28px;padding:62px 18px 18px;text-align:center;position:relative;box-shadow:0 8px 30px rgba(22,20,43,.08)}
.pcard2 .av{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:88px;height:88px;font-size:30px;border:5px solid #fff;background:linear-gradient(135deg,#FF7A59,#FFB020)}
.ver{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:700;color:var(--brand-d);background:var(--brand-l);padding:5px 11px;border-radius:99px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.stats b{font-size:21px;display:block;letter-spacing:-.5px}
.stats small{font-size:11.5px;color:var(--ink2)}
.stats div+div{border-left:1px solid var(--line)}
.avail{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.avail div{font-size:11px;font-weight:700;color:var(--ink3)}
.avail i{display:block;height:34px;border-radius:10px;background:#E8E6F4;margin-top:6px}
.avail i.a{background:var(--mint)}
.avail i.b{background:#8be3ca}
.reward{margin:0 20px 12px;background:#fff;border-radius:22px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 12px rgba(22,20,43,.05)}
.reward .tile{width:56px;height:56px;font-size:26px;border-radius:18px}
.reward b{font-size:15px;display:block}
.reward small{font-size:12.5px;color:var(--ink2)}
.reward button{margin-left:auto;padding:9px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;white-space:nowrap}
.reward button.dis{background:#E8E6F4;color:var(--ink3)}
.level{margin:0 20px;background:var(--ink);color:#fff;border-radius:24px;padding:18px;position:relative;overflow:hidden}
.level .bar{height:9px;border-radius:5px;background:rgba(255,255,255,.15);margin:12px 0 8px;overflow:hidden}
.level .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#FFC93C,#FF9A1F)}
.level small{font-size:12px;color:#b8b5de}

/* ---------- welcome / onboarding ---------- */
.welcome{background:linear-gradient(170deg,#4a3bf0 0%,#7a4dff 50%,#d65bff 100%);color:#fff;align-items:center;text-align:center;padding:0 28px}
.welcome .rings{position:absolute;inset:0;pointer-events:none}
.wlogo{margin-top:150px}
.welcome h1{font-size:50px;letter-spacing:-2px;margin:14px 0 8px}
.welcome p{font-size:17px;opacity:.9;line-height:1.45;max-width:290px}
.floaters{position:absolute;inset:0;pointer-events:none}
.floaters span{position:absolute;font-size:38px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;animation:flt 5s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-12px) rotate(4deg)}}
.welcome .bot{margin-top:auto;width:100%;padding-bottom:50px;position:relative;z-index:2}
.welcome .btn.w{background:#fff;color:var(--brand-d);box-shadow:0 14px 30px rgba(0,0,0,.2)}
.welcome small{display:block;margin-top:14px;font-size:12.5px;opacity:.8}
.bigint{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.int{background:#fff;border:2px solid transparent;border-radius:20px;padding:14px 0 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink2);transition:.15s;position:relative}
.int span{font-size:30px}
.int.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.int.on:after{content:"✓";position:absolute;top:6px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.progress{display:flex;gap:6px;margin-bottom:18px}
.progress i{flex:1;height:5px;border-radius:3px;background:#DAD8EC}
.progress i.on{background:var(--brand)}
.ob-foot{position:absolute;bottom:0;left:0;right:0;padding:14px 20px 36px;background:linear-gradient(to top,var(--bg) 70%,rgba(245,244,251,0))}
.notice{display:flex;gap:10px;background:var(--mint-l);border-radius:16px;padding:12px 14px;font-size:12.5px;color:#0b6f54;margin:14px 0;line-height:1.4;font-weight:600}
</style>

/* =========================================================
   RENDER
   ========================================================= */
let lastKey='';
function render(keepScroll=true){
  const app=$('#app');
  const old=app.querySelector('.scroll, .sheetbody');
  const st=old?old.scrollTop:0;
  const top=S.stack[S.stack.length-1];
  let html='',light=false;
  if(S.screen==='welcome'){html=welcome();light=true}
  else if(S.screen==='interests'){html=interests()}
  else if(top){
    if(top.n==='detail'){html=detail(top.id);}
    if(top.n==='chat'){html=chatView(top.id)}
    if(top.n==='create'){html=create()}
  } else {html={discover,plans,chats,me}[S.tab]()}
  const key=S.screen+'|'+JSON.stringify(top)+'|'+S.tab;
  const same=key===lastKey; lastKey=key;
  app.innerHTML=html+sheet()+(S.toast?`<div class="toast"><span>${S.toast.ic}</span>${S.toast.msg}</div>`:'');
  if(!same)app.querySelector('.view').classList.add('go'); else{app.querySelector('.view').style.animation='none'}
  const sc=app.querySelector('.scroll, .sheetbody'); if(sc&&same&&keepScroll)sc.scrollTop=st;
  const m=$('#msgs'); if(m)m.scrollTop=m.scrollHeight;
  $('#status').classList.toggle('light',light||(top&&top.n==='detail'));
  $('#homebar').classList.toggle('light',light);
  document.querySelectorAll('#jump button').forEach(b=>b.classList.toggle('on',b.dataset.j===curJump()));
}
function curJump(){
  const top=S.stack[S.stack.length-1];
  if(S.screen==='welcome')return 'welcome';
  if(S.screen==='interests')return 'interests';
  if(S.sheet&&S.sheet.n==='book')return 'book';
  if(top){return {detail:'detail',chat:'chat',create:'create'}[top.n]}
  return {discover:'discover',plans:'plans',chats:'chats',me:'me'}[S.tab];
}

/* =========================================================
   ACTIONS
   ========================================================= */
function go(tab){S.tab=tab;S.stack=[];S.sheet=null;render()}
const A={
  start(){S.screen='interests';render()},
  int(v){S.interests.has(v)?S.interests.delete(v):S.interests.add(v);render()},
  finish(){S.screen='app';S.tab='discover';render();toast('Welcome to Circl, Sam','👋')},
  tab(v){go(v)},
  filter(v){S.filter=v;render()},
  open(v){S.stack.push({n:'detail',id:+v});render()},
  back(){S.stack.pop();render()},
  connect(v){S.connected.add(v);render();toast(`Request sent to ${PEOPLE[v].n}`,'👋')},
  join(v){const a=act(+v);if(a.cost){S.sheet={n:'book',id:a.id};render()}else{S.joined.add(a.id);S.sheet={n:'done',id:a.id};render()}},
  confirmbook(v){S.joined.add(+v);S.sheet={n:'done',id:+v};render()},
  closesheet(){S.sheet=null;render()},
  'chat-of'(v){S.sheet=null;const c=CHATS.find(x=>x.act===+v);if(c){S.stack=[{n:'chat',id:c.id}]}else{const id=CHATS.length+1;const a=act(+v);CHATS.unshift({id,act:a.id,un:0,time:'Now',msgs:[['sys',`You joined · ${a.t}`]]});S.chatLog[id]=[['sys',`You joined · ${a.t}`],[a.going[0],`Welcome! Glad you could make it 🙌`]];S.stack=[{n:'chat',id}]}render()},
  chat(v){const c=CHATS.find(x=>x.id===+v);c.un=0;S.stack.push({n:'chat',id:+v});render()},
  send(v){const i=$('#chatin');const t=i.value.trim();if(!t)return;S.chatLog[+v].push(['me',t]);render();$('#chatin').focus();
    setTimeout(()=>{const r=Object.keys(PEOPLE)[Math.floor(Math.random()*3)];S.chatLog[+v].push([r,['Love it 🙌','Same, see you there!','Nice one, can\'t wait!'][Math.floor(Math.random()*3)]]);if(curJump()==='chat')render()},1400)},
  quick(v,el){const id=+el.dataset.id;S.chatLog[id].push(['me',v]);render()},
  seg(v){S.planSeg=v;render()},
  checkin(v){S.checked.add(+v);S.points+=50;render();toast('Attendance verified · +50 pts','🏅')},
  create(){S.stack=[{n:'create'}];render()},
  cat(v){S.newCat=v;render()},
  step(v,el){S.newSpots=Math.max(2,Math.min(30,S.newSpots+ +el.dataset.d));render()},
  tog(v){S.tog[v]=!S.tog[v];render()},
  publish(){
    const t=($('#nt')||{}).value||'New activity';const w=($('#nw')||{}).value||'Soon';const l=($('#nl')||{}).value||'Campus';
    const e=CATS.find(c=>c.id===S.newCat).e;
    const a={id:ACTS.length+1,e,t,cat:S.newCat,when:w,day:'Thu',where:l,cost:0,spots:S.newSpots,going:[],beginner:S.tog.beginner,host:'You',hostE:'🙋',about:'Created by you. Others with matching interests will see this in their feed.',why:'You created this activity'};
    ACTS.unshift(a);S.joined.add(a.id);S.stack=[];S.tab='discover';S.filter='All';render();toast('Published! We\'ll notify matching students','🚀')},
  redeem(v){const r=REWARDS[+v];if(S.redeemed.has(+v))return;if(S.points<r.p){toast(`Need ${r.p-S.points} more pts`,'🔒');return}S.points-=r.p;S.redeemed.add(+v);render();toast(`${r.t} unlocked`,'🎁')},
  toast(v){toast(v)},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||!$('#screen').contains(el))return;
  const f=A[el.dataset.act];if(f)f(el.dataset.v,el);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatin'){const c=S.stack[S.stack.length-1];A.send(c.id)}});

/* ---------- jump list ---------- */
const JUMPS=[
  ['welcome','Welcome',()=>{S.screen='welcome';S.stack=[];S.sheet=null;render()}],
  ['interests','Pick interests',()=>{S.screen='interests';S.stack=[];S.sheet=null;render()}],
  ['discover','Discover feed',()=>{S.screen='app';go('discover')}],
  ['detail','Activity details',()=>{S.screen='app';S.tab='discover';S.sheet=null;S.stack=[{n:'detail',id:4}];render()}],
  ['book','Booking & payment',()=>{S.screen='app';S.tab='discover';S.stack=[{n:'detail',id:4}];S.sheet={n:'book',id:4};render()}],
  ['plans','My plans & check-in',()=>{S.screen='app';S.joined.add(1);go('plans')}],
  ['chats','Chats',()=>{S.screen='app';go('chats')}],
  ['chat','Group chat',()=>{S.screen='app';S.tab='chats';S.sheet=null;S.stack=[{n:'chat',id:1}];render()}],
  ['create','Create activity',()=>{S.screen='app';S.tab='discover';S.sheet=null;S.stack=[{n:'create'}];render()}],
  ['me','Profile & rewards',()=>{S.screen='app';go('me')}],
];
$('#jump').innerHTML=JUMPS.map((j,i)=>`<button data-j="${j[0]}">${j[1]}<span>${String(i+1).padStart(2,'0')}</span></button>`).join('');
$('#jump').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;JUMPS.find(j=>j[0]===b.dataset.j)[2]()});

/* ---------- scale phone to window ---------- */
function fit(){
  const pad=24, h=innerHeight-pad*2, w=innerWidth-pad*2;
  const s=Math.min(1,h/876,w/417);
  const st=$('#stage');
  st.style.width=417*s+'px';st.style.height=876*s+'px';
  $('#phone').style.transform=`scale(${s})`;
}
addEventListener('resize',fit);fit();
render();
</script>
</body>
</html>
